<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HQL_Book - Mạng Xã Hội</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== HEADER ===== -->
<div class="header">
  <div class="logo" onclick="showFeed()">HQL_Book</div>
  <div class="header-actions">
    <button class="icon-btn" onclick="openSearch()" title="Tìm bạn bè">🔍</button>
    <button class="icon-btn" onclick="openFriends()" title="Bạn bè">
      👥<span class="badge" id="friendBadge" style="display:none">0</span>
    </button>
    <button class="icon-btn" onclick="toggleContacts()" title="Tin nhắn">
      💬<span class="badge" id="msgBadge" style="display:none">0</span>
    </button>
    <button class="icon-btn" onclick="openProfile()" title="Hồ sơ">⚙️</button>
    <div class="avatar" id="myAvatar" onclick="openProfile()">U</div>
  </div>
</div>

<!-- ===== MAIN ===== -->
<div class="main">
  
  <!-- LEFT SIDEBAR -->
  <div class="sidebar">
    <div class="menu-item active" onclick="showFeed()">
      <span class="icon">🏠</span><span>Trang chủ</span>
    </div>
    <div class="menu-item" onclick="openFriends()">
      <span class="icon">👥</span><span>Bạn bè</span>
    </div>
    <div class="menu-item" onclick="toggleContacts()">
      <span class="icon">💬</span><span>Tin nhắn</span>
    </div>
    <div class="menu-item" onclick="openSearch()">
      <span class="icon">🔍</span><span>Tìm bạn bè</span>
    </div>
    <div class="menu-item" onclick="openProfile()">
      <span class="icon">👤</span><span>Hồ sơ</span>
    </div>
    
    <div class="sidebar-title">Bạn bè</div>
    <div class="contacts-list" id="friendsListSidebar"></div>
  </div>
  
  <!-- FEED -->
  <div class="feed" id="feedSection">
    
    <div class="composer">
      <div class="composer-top">
        <div class="avatar" id="composerAvatar">U</div>
        <textarea class="composer-input" id="postInput" placeholder="Bạn đang nghĩ gì?"></textarea>
      </div>
      
      <div class="attachment-preview" id="attachPreview">
        <button class="remove-attach" onclick="removeAttachment()">✕</button>
        <div id="attachContent"></div>
      </div>
      
      <div class="composer-actions">
        <div class="composer-tools">
          <button class="tool-btn" onclick="document.getElementById('postImageInput').click()">🖼️ Ảnh</button>
          <button class="tool-btn" onclick="document.getElementById('postVideoInput').click()">🎥 Video</button>
          <button class="tool-btn" onclick="document.getElementById('postFileInput').click()">📎 Tệp</button>
        </div>
        <button class="post-btn" id="postBtn" onclick="createPost()" disabled>Đăng</button>
      </div>
      
      <input type="file" id="postImageInput" accept="image/*" hidden>
      <input type="file" id="postVideoInput" accept="video/*" hidden>
      <input type="file" id="postFileInput" hidden>
    </div>
    
    <div id="postsContainer"></div>
    <div class="empty-feed" id="emptyFeed">
      <div class="icon">📭</div>
      <h3>Chưa có bài viết nào</h3>
      <p>Hãy đăng bài viết đầu tiên!</p>
    </div>
  </div>
  
  <!-- RIGHT SIDEBAR -->
  <div class="sidebar right-sidebar">
    <div class="sidebar-title">Người liên hệ</div>
    <div class="contacts-list" id="contactsList"></div>
  </div>
</div>

<!-- ===== CHAT WINDOW ===== -->
<div class="chat-window" id="chatWindow">
  <div class="chat-header">
    <div class="contact-avatar" id="chatAvatar">?</div>
    <div class="chat-header-info">
      <div class="chat-header-name" id="chatName">Chọn người để chat</div>
      <div class="chat-header-status" id="chatStatus">Đang hoạt động</div>
    </div>
    <button class="chat-close" onclick="closeChat()">✕</button>
  </div>
  
  <div class="chat-messages" id="chatMessages"></div>
  
  <div class="chat-input-area">
    <div class="chat-tools">
      <button class="chat-tool" onclick="document.getElementById('chatImageInput').click()" title="Gửi ảnh">🖼️</button>
      <button class="chat-tool" onclick="document.getElementById('chatVideoInput').click()" title="Gửi video">🎥</button>
      <button class="chat-tool" onclick="document.getElementById('chatFileInput').click()" title="Gửi tệp">📎</button>
    </div>
    <div class="chat-input-row">
      <input type="text" class="chat-input" id="chatInput" placeholder="Aa..." 
             onkeydown="if(event.key==='Enter') sendMessage()">
      <button class="chat-send" onclick="sendMessage()">➤</button>
    </div>
    <input type="file" id="chatImageInput" accept="image/*" hidden>
    <input type="file" id="chatVideoInput" accept="video/*" hidden>
    <input type="file" id="chatFileInput" hidden>
  </div>
</div>

<!-- ===== SEARCH MODAL ===== -->
<div class="modal" id="searchModal">
  <div class="modal-content">
    <h2>🔍 Tìm bạn bè</h2>
    <input class="search-input" id="searchInput" placeholder="Nhập tênblock; ngcolorười dùng...":# oninput="searchUsers00()">
    <div id="searchResults"></div>
    <button class="modal-btn secondary" onclick="closeModal('searchModal')" style="margin-top:15px">Đóng</button>
  </div>
</div>

<!-- ===== FRIENDS MODAL ===== -->
<div class="modal" id="friendsModal">
  <div class="modal-content">
    <h2>👥 Bạn bè của bạn</h2>
    <div id="friendsListModal"></div>
    <button class="modal-btn secondary" onclick="closeModal('friendsModal')" style="margin-top:15px">Đóng</button>
  </div>
</div>

<!-- ===== PROFILE MODAL ===== -->
<div class="modal" id="profileModal">
  <div class="modal-content">
    <h2>👤 Hồ sơ của bạn</h2>
    <div style="display:flex;justify-content:center;margin-bottom:20px">
      <div class="avatar" style="width:100px;height:100px;font-size:40px" id="profileAvatar">U</div>
    </div>
    <input type="text" id="profileNameInput" placeholder="Tên của bạn">
    <textarea id="profileBioInput" placeholder="Giới thiệu về bạn..." rows="3"></textarea>
    <label style="display:d4ff;margin-bottom:8px;font-size:0.9em">Ảnh đại diện</label>
    <input type="file" id="profileAvatarInput" accept="image/*" style="padding:8px">
    <div style="margin-top:15px">
      <button class="modal-btn primary" onclick="saveProfile()">Lưu</button>
      <button class="modal-btn secondary" onclick="closeModal('profileModal')">Hủy</button>
    </div>
    <div style="margin-top:25px;padding-top:20px;border-top:1px solid #3a3b3c">
      <button class="modal-btn secondary" onclick="clearAllData()" style="background:#ff2d55;color:#fff">
        🗑 Xóa toàn bộ dữ liệu
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- MOBILE NAV -->
<div class="mobile-nav">
  <button class="icon-btn" onclick="showFeed()">🏠</button>
  <button class="icon-btn" onclick="openSearch()">🔍</button>
  <button class="icon-btn" onclick="toggleContacts()">💬</button>
  <button class="icon-btn" onclick="openFriends()">👥</button>
  <button class="icon-btn" onclick="openProfile()">👤</button>
</div>

<script src="script.js"></script>
</body>
</html>
